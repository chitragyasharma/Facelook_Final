<!DOCTYPE html>
<html>
<body>
  <div id="coupon-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="coupon-modal-title">Create Coupon</h3>
        <button class="close-btn" onclick="closeCouponModal()">&times;</button>
      </div>
      <form id="coupon-form" onsubmit="event.preventDefault(); saveCoupon();">
        <input type="hidden" id="coupon-id">
      </form>
    </div>
  </div>
  <script>
    function openCouponModal() {
        document.getElementById('coupon-form').reset();
        document.getElementById('coupon-id').value = '';
        document.getElementById('coupon-modal-title').innerText = 'Create Coupon';
        document.getElementById('coupon-modal').style.display = 'flex';
        console.log("Success!");
    }
    openCouponModal();
  </script>
</body>
</html>
