<!DOCTYPE html>
<html>
<head>
<style>
.detail-img-col {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: 0;
  overflow: hidden;
}
.detail-img {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: red; /* so we can see it */
  display: flex;
  align-items: center;
  justify-content: center;
}
#detail-emoji {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  background: blue; /* so we can see it */
}
img {
  width: 100%;
  object-fit: contain;
}
</style>
</head>
<body>
  <div style="display:flex;"> <!-- desktop-detail-wrapper -->
    <div class="detail-img-col">
      <div class="detail-img">
        <span id="detail-emoji">
          <!-- no src to simulate failure, or small src -->
          <img src="" id="main-detail-img">
        </span>
      </div>
    </div>
    <div style="flex:1;">Body</div>
  </div>
  <script>
    console.log(document.querySelector('.detail-img').clientHeight);
  </script>
</body>
</html>
